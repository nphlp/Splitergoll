# Bluetooth direct, y compris pendant la charge USB.
CONFIG_ZMK_USB=n

# Inactivité après deux minutes, en conservant la connexion Bluetooth.
CONFIG_ZMK_IDLE_TIMEOUT=120000

# Veille après dix minutes sur batterie, avec réveil par la matrice.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000
CONFIG_ZMK_BATTERY_REPORTING=y

# Mesure de chaque batterie toutes les cinq secondes pendant l’activité.
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=5
