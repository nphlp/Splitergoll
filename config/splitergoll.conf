# USB host output on the left, Bluetooth communication between halves.
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_BLE=y

# USB power, without batteries.
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_BATTERY_REPORTING=n

# Preserve the encoder, pointing and macro behavior of the full dongle keymap.
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MACRO_DEFAULT_WAIT_MS=0
CONFIG_ZMK_MACRO_DEFAULT_TAP_MS=0

CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=10
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10
