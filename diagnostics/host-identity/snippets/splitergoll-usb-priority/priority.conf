# Sortie clavier native et identité sur deux interfaces HID distinctes, sans port série.
CONFIG_ZMK_USB=y
CONFIG_SPLITERGOLL_USB_PRIORITY=y
CONFIG_SPLITERGOLL_HOST_IDENTITY=y
CONFIG_USB_HID_DEVICE_COUNT=2
CONFIG_USB_DEVICE_PRODUCT="Splitergoll USB priority"
CONFIG_BT_ATT_PREPARE_COUNT=4
CONFIG_USB_REQUEST_BUFFER_SIZE=128
